name: Deploy to Pages

# The site is plain static HTML, so there is nothing to build. This publishes
# the repository contents directly and never touches actions/jekyll-build-pages,
# which is what the branch-based deploy used and what started failing with 429s
# and 503s on 2026-08-17.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repository, matching what the branch deploy served.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
